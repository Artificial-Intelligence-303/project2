name: Plan sign-off
description: Posted by the instructor after reading docs/plan.md. There is nothing here for you to fill in.
title: "Project 2 plan sign-off"
labels: ["plan sign-off"]
body:
  - type: markdown
    attributes:
      value: |
        Posted by the instructor after reading your `docs/plan.md`. Nothing here is graded and
        nothing here is for you to fill in. A ticked box is a part of the plan that is settled.
        Anything left unticked is what to change before you build that part.
  - type: checkboxes
    attributes:
      label: The plan
      options:
        - label: "The task is a real one, for one person, and the three requests are things that person would type."
        - label: "The dataset is public, its source and license are linked, it is trimmed to the task, and it describes things rather than people."
        - label: "Records about the person are real-like: made up, in the shape of the real data."
        - label: "At least three tools besides remember and recall, and each is a single action an agent can choose."
        - label: "One tool only reads, and one changes something; any tool that cannot be undone is marked that way."
        - label: "What is worth remembering is specific to the task, and it is something the agent needs in a later session."
        - label: "The retrieval method is named, fits the notes the task produces, and returns at most five notes."
        - label: "Two guardrails, each a check the server makes, with the error result the model reads."
        - label: "The six evaluation tasks cover every kind the README lists, the planted instruction included."
        - label: "Goal 2 is about memory and stated so reflection.md can say whether it was met."
  - type: textarea
    attributes:
      label: Notes
